[package]
name = "rdflib-turbo-native"
version = "0.2.0-alpha.7"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
description = "Native exact-term RDF dataset runtime for Python"
repository = "https://github.com/legra-ai/rdflib-turbo"
authors = ["DataRoad Inc, Delaware, USA, trading as Legra"]
publish = false

[package.metadata.version-info]
pre_bump_hooks = ["uv run --no-project python scripts/sync_version.py {{version}}"]
additional_files = ["pyproject.toml", "uv.lock"]

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
# Test-binary allocation accounting; never enable in published wheels.
allocation-profiling = []
# The Python wheels include this capability; Store() still defaults to memory.
persistence = ["oxigraph/rocksdb"]

[dependencies]
pyshacl-turbo-engine = { git = "https://github.com/legra-ai/pyshacl-turbo", rev = "665bf494eab65501affd6e16b08b94ef8a41900c" }
serde = { version = "1", features = ["derive"] }
oxigraph = { version = "=0.5.11", default-features = false, features = ["exact-term-storage"] }
oxrdf = { version = "=0.3.4", features = ["rdf-10-string-identity"] }
pyo3 = { version = "=0.30.1" }
serde_json = "1"
oxilangtag = "=0.1.6"
spargebra = "=0.4.7"
sparopt = "=0.3.7"
spareval = { version = "=0.2.7", features = ["exact-custom-function-terms", "exact-term-builtins", "rdf-set-union"] }
thiserror = "2"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
oxrocksdb-sys = { path = "vendor/oxrocksdb-sys-0.5.11" }
oxigraph = { path = "vendor/oxigraph-0.5.11" }
fancy-regex = { git = "https://github.com/legra-ai/pyshacl-turbo", rev = "665bf494eab65501affd6e16b08b94ef8a41900c" }
oxrdf = { path = "vendor/oxrdf-0.3.4" }
sparopt = { path = "vendor/sparopt-0.3.7" }
spareval = { path = "vendor/spareval-0.2.7" }
spargebra = { path = "vendor/spargebra-0.4.7" }
oxsdatatypes = { path = "vendor/oxsdatatypes-0.2.3" }
