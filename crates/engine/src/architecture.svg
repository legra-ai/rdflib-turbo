<svg xmlns="http://www.w3.org/2000/svg" width="760" height="840" viewBox="0 0 760 840" style="max-width:100%;height:auto" role="img" aria-labelledby="borrowed-graph-title borrowed-graph-description">
  <title id="borrowed-graph-title">Borrowed graph SPARQL architecture</title>
  <desc id="borrowed-graph-description">An in-memory Dataset or an open Oxigraph transaction implements GraphRead. Optional UnionGraph and OverlayGraph views feed QueryGraph, which implements QueryableDataset for the SPARQL evaluator. The overlay borrows a separate shapes graph.</desc>
  <defs>
    <marker id="borrowed-graph-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"></path></marker>
  </defs>
  <rect width="760" height="840" rx="12" fill="#ffffff"></rect>
  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#borrowed-graph-arrow)">
    <path d="M185 86 V108 H320 V132"></path><path d="M485 86 V108 H320 V132"></path>
    <path d="M320 192 V222"></path><path d="M320 282 V312"></path>
    <path d="M600 342 H532"></path><path d="M320 372 V402"></path><path d="M320 462 V492"></path>
  </g>
  <g stroke="#64748b" stroke-width="1.5">
    <rect x="40" y="26" width="290" height="60" rx="8" fill="#f1f5f9"></rect>
    <rect x="360" y="26" width="250" height="60" rx="8" fill="#f1f5f9"></rect>
    <rect x="110" y="132" width="420" height="60" rx="8" fill="#dbeafe"></rect>
    <rect x="110" y="222" width="420" height="60" rx="8" fill="#f0fdf4" stroke-dasharray="6 4"></rect>
    <rect x="110" y="312" width="420" height="60" rx="8" fill="#f0fdf4" stroke-dasharray="6 4"></rect>
    <rect x="600" y="312" width="140" height="60" rx="8" fill="#f1f5f9"></rect>
    <rect x="110" y="402" width="420" height="60" rx="8" fill="#dbeafe"></rect>
    <rect x="110" y="492" width="420" height="60" rx="8" fill="#ede9fe"></rect>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#0f172a" text-anchor="middle">
    <text x="185" y="63">In-memory Dataset</text><text x="485" y="52">Open Oxigraph</text><text x="485" y="74">transaction</text>
    <text x="320" y="158">GraphRead</text><text x="320" y="180" font-size="14">Indexed quad streams + named graph metadata</text>
    <text x="320" y="248">UnionGraph · optional</text><text x="320" y="270" font-size="14">Data union in default graph; retain named contexts</text>
    <text x="320" y="338">OverlayGraph · optional</text><text x="320" y="360" font-size="14">Separate reserved named shapes graph</text><text x="670" y="349">Shapes</text>
    <text x="320" y="428">QueryGraph</text><text x="320" y="450" font-size="14">Implements SPARQL QueryableDataset</text>
    <text x="320" y="518">SPARQL evaluator</text><text x="320" y="540" font-size="14">Parsing, plans, joins, filters and property paths</text>
    <text x="380" y="591" font-size="15">Borrow the base data; stream reads; propagate storage errors.</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a">
    <rect x="40" y="625" width="680" height="65" rx="8" fill="#dbeafe" stroke="#64748b"/>
    <text x="380" y="651" font-size="18">SHACL commit gate on the same transaction</text>
    <text x="380" y="675" font-size="14">Pending writes → inference → rules → constraints → report</text>
    <path d="M250 690 V728" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#borrowed-graph-arrow)"/>
    <path d="M510 690 V728" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#borrowed-graph-arrow)"/>
    <rect x="80" y="730" width="300" height="60" rx="8" fill="#f0fdf4" stroke="#64748b"/>
    <rect x="410" y="730" width="300" height="60" rx="8" fill="#fef2f2" stroke="#64748b"/>
    <text x="230" y="755" font-size="17">Conforms: commit all changes</text>
    <text x="230" y="777" font-size="14">After report processing succeeds</text>
    <text x="560" y="755" font-size="17">Nonconformance / error: abort</text>
    <text x="560" y="777" font-size="14">Discard the transaction delta</text>
    <text x="380" y="820" font-size="14">Direct Rust validation returns a report; its caller owns commit policy.</text>
  </g>
</svg>
