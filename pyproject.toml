[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "rdflib-turbo"
version = "0.2.0a17"
description = "Native exact-term RDF datasets, parsing and SPARQL for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "vendor/**/LICENSE*"]
authors = [{ name = "DataRoad Inc, Delaware, USA, trading as Legra" }]
dependencies = ["rdflib>=7.3,<8"]

[project.urls]
Repository = "https://github.com/legra-ai/rdflib-turbo"
Issues = "https://github.com/legra-ai/rdflib-turbo/issues"

[project.optional-dependencies]
test = [
    "packaging>=26.3",
    "owlrl==7.6.2",
    "pyshacl-turbo>=0.5.0",
    "pytest<10,>=8",
    "pytest-cov>=7.1,<8",
    "ruff>=0.12",
]

[tool.maturin]
profile = "release"
locked = true
editable-profile = "release"
features = ["pyo3/extension-module", "persistence"]
python-source = "python"
module-name = "rdflib_turbo._native"
include = [{path = ".cargo/config.toml", format = "sdist"}, {path = "uv.lock", format = "sdist"}, {path = "build_support/**/*", format = "sdist"}, {path = "vendor/**/*", format = "sdist"}, {path = "tests/**/*", format = "sdist"}, {path = "docs/**/*", format = "sdist"}, {path = "scripts/**/*", format = "sdist"}, {path = ".github/**/*", format = "sdist"}, {path = "rust-toolchain.toml", format = "sdist"}]
exclude = ["**/target/**/*", "**/__pycache__/**/*", "docs/plans/**", "docs/parity-evidence/**"]

# Apply the same SDK minimum to user source builds and wheel tags, not just CI.
[tool.maturin.target.x86_64-apple-darwin]
macos-deployment-target = "11.0"

[tool.maturin.target.aarch64-apple-darwin]
macos-deployment-target = "11.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF"]

[tool.coverage.run]
source = ["rdflib_turbo"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.uv.sources]
pyshacl-turbo = { git = "https://github.com/legra-ai/pyshacl-turbo", rev = "0002b1c346229b53e6ef89db80d684612946af39" }

[dependency-groups]
dev = [
    "mypy>=1.15,<3",
    "ruff>=0.12",
]
coverage = [
    "rdflib==7.6.0",
    "owlrl==7.6.2",
    "pyshacl==0.40.1",
    "pyshacl-turbo==0.6.3",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]
