[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "rdflib-turbo"
version = "0.1.0a2"
description = "Native exact-term RDF datasets, parsing and SPARQL for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "vendor/**/LICENSE*"]
authors = [{ name = "DataRoad Inc, Delaware, USA, trading as Legra" }]
dependencies = ["rdflib>=7.3,<8"]

[project.urls]
Repository = "https://github.com/legra-ai/rdflib-turbo"
Issues = "https://github.com/legra-ai/rdflib-turbo/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=7.1,<8", "ruff>=0.12"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "rdflib_turbo._native"
include = [{path = "requirements-coverage.in", format = "sdist"}, {path = "requirements-coverage.lock", format = "sdist"}, {path = "vendor/**/*", format = "sdist"}, {path = "tests/**/*", format = "sdist"}, {path = "docs/**/*", format = "sdist"}, {path = "scripts/**/*", format = "sdist"}, {path = ".github/**/*", format = "sdist"}, {path = "rust-toolchain.toml", format = "sdist"}]
exclude = ["**/target/**/*", "**/__pycache__/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF"]

[tool.coverage.run]
source = ["rdflib_turbo"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
