name: Merge tested dependencies
on:
  workflow_run:
    workflows: [Tests and wheels]
    types: [completed]
permissions:
  contents: read
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      # Trusted workflow only: do not check out or run pull-request code.
      - uses: actions/create-github-app-token@v3
        id: writer
        with:
          app-id: ${{ secrets.RELEASE_WRITER_APP_ID }}
          private-key: ${{ secrets.RELEASE_WRITER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: legra-ai/github-actions/.github/actions/merge-tested-dependabot@87feab0f30d03f3d2185de73efc07f1e67175d70
        with:
          token: ${{ steps.writer.outputs.token }}
