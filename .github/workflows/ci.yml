name: Tests and wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      inference-comparison:
        description: Comparison only; skip release graph, informational timing
        type: boolean
        default: false
      comparison-base:
        description: Exact public baseline commit
        type: string
        default: '7008ca50501db8d09491955b49940a7031a4e253'
      comparison-head:
        description: Exact public candidate commit
        type: string
        default: '27241774424becd319debb1072cf69f7d4b10849'
  schedule:
    - cron: '23 4 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash {0}

jobs:
  prepare:
    if: github.event_name != 'workflow_dispatch' || !inputs['inference-comparison']
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
      cargo-version: ${{ steps.versions.outputs.cargo-version }}
      release: ${{ steps.release.outputs.release }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
      - uses: actions/create-github-app-token@v3
        id: writer
        if: github.ref == 'refs/heads/main'
        with:
          app-id: ${{ secrets.RELEASE_WRITER_APP_ID }}
          private-key: ${{ secrets.RELEASE_WRITER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - id: release
        uses: legra-ai/github-actions/.github/actions/prepare-cargo-release@586689276e02ded2be5b9dfffbed070a8a9ba50b
        with:
          token: ${{ steps.writer.outputs.token }}
          tag-format: pep440
      - name: Check out the prepared release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.revision }}
      - id: versions
        env:
          PREPARED_VERSION: ${{ steps.release.outputs.version }}
        run: uv run --no-project python scripts/release_version.py

  sdist:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
          # Archives normalize mtimes; path-dependency artifacts require content identity.
          cache-key: vendor-${{ hashFiles('vendor/**') }}
      - run: uv build --sdist --out-dir dist -C 'maturin.build-args=--locked'
      - run: uv run --no-project python scripts/audit_sdist.py dist/*.tar.gz
      - run: uv tool run --from twine==6.2.0 twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: [prepare, sdist]
    runs-on: ${{ matrix.os }}
    # Intel's five builds and installed suites exceed even the two-hour budget.
    # Two disjoint cohorts retain every interpreter within the same bounded limit.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 120 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python-versions: '3.11 3.12 3.13 3.14 3.15'
            artifact: release-wheel-x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            python-versions: '3.11 3.12 3.13 3.14 3.15'
            artifact: release-wheel-aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64:latest
          - os: macos-15-intel
            target: x86_64-apple-darwin
            python-versions: '3.11 3.12 3.13'
            artifact: release-wheel-x86_64-apple-darwin-cp311-cp313
          - os: macos-15-intel
            target: x86_64-apple-darwin
            python-versions: '3.14 3.15'
            artifact: release-wheel-x86_64-apple-darwin-cp314-cp315
          - os: macos-15
            target: aarch64-apple-darwin
            python-versions: '3.11 3.12 3.13 3.14 3.15'
            artifact: release-wheel-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-versions: '3.11 3.12 3.13 3.14 3.15'
            artifact: release-wheel-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
          target: ${{ matrix.target }}
          cache-key: vendor-${{ hashFiles('vendor/**') }}
      - uses: actions/download-artifact@v8
        with:
          name: release-sdist
          path: source-dist
      - name: Unpack the tested source distribution once for every interpreter
        run: |
          mkdir source-build || exit 1
          # Restored Cargo outputs can be newer than archive timestamps. Establish
          # checkout freshness while preserving the tested archive and source bytes.
          tar -xzmf source-dist/*.tar.gz --strip-components=1 -C source-build || exit 1
      - name: Build native manylinux wheel from source archive
        if: runner.os == 'Linux'
        run: sh scripts/build_manylinux.sh '${{ matrix.container }}' '${{ matrix.target }}' cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314 cp315-cp315
      - name: Build native wheel from source archive
        if: runner.os != 'Linux'
        env:
          # The stable source-build path and target retain vendor compilation across interpreters.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          uv python install ${{ matrix.python-versions }} || exit 1
          for python in ${{ matrix.python-versions }}; do
            uv build --wheel --python "$python" --out-dir dist -C 'maturin.build-args=--locked --target ${{ matrix.target }} --compatibility pypi' source-build || exit 1
          done
      - run: uv tool run --from twine==6.2.0 twine check --strict dist/*
      - name: Test the installed wheel without source-tree imports
        run: uv run --no-project python scripts/test_wheel.py --python-versions ${{ matrix.python-versions }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  native-coverage:
    needs: prepare
    uses: ./.github/workflows/native-coverage.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          cache-key: vendor-${{ hashFiles('vendor/**') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt
      - run: cargo +nightly-2026-10-16 fmt --check
      - run: cargo clippy --locked -- -D warnings
      - name: Immutable native engine source metadata
        run: make test-build-metadata
      - name: Patched datatype parser regressions
        run: cargo test --locked -p oxsdatatypes --lib
      - name: CONSTRUCT ownership and identity regressions
        run: uv run --no-project python -m scripts.vendor_evaluator_tests
      - name: Dataset ownership, ordering and transaction regressions
        run: uv run --no-project python -m scripts.vendor_dataset_tests
      - name: Exact-term transactional storage contracts
        run: make test-store-contract
      - name: Native allocation regression budgets
        run: uv run --no-project --python 3.13 python -m scripts.allocation_budgets
      - run: uv run --locked --extra test ruff check python tests scripts
      - run: uv run --locked --extra test ruff format --check python tests scripts

  test:
    name: test
    needs: [prepare, verify, sdist, wheels, native-coverage]
    if: always() && (github.event_name != 'workflow_dispatch' || !inputs['inference-comparison'])
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Require all release checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: uv run --no-project python {0}
        run: |
          import json, os
          failures = [name for name, job in json.loads(os.environ['RESULTS']).items() if job['result'] != 'success']
          if failures:
              raise SystemExit(f'Required release checks failed: {failures}')
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: uv run --no-project python scripts/release_packages.py check-build

  publish:
    needs: [prepare, test]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rdflib-turbo/
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
      CARGO_RELEASE_VERSION: ${{ needs.prepare.outputs.cargo-version }}
    steps:
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: legra-ai/github-actions/.github/actions/tag-tested-release@586689276e02ded2be5b9dfffbed070a8a9ba50b
        with:
          version: ${{ needs.prepare.outputs.cargo-version }}
          revision: ${{ needs.prepare.outputs.revision }}
          tag-format: pep440
      - run: uv run --no-project python scripts/release_packages.py draft
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: uv run --no-project python scripts/release_packages.py stage
      - id: pending
        run: uv run --no-project python scripts/release_packages.py filter
      - name: Attest the original tested archives
        if: steps.pending.outputs.missing == 'true'
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027
        with:
          paths: pending-packages/*
      - if: steps.pending.outputs.missing == 'true'
        run: uv publish --trusted-publishing always pending-packages/*
      - run: uv run --no-project python scripts/release_packages.py verify
      - run: gh release edit "v$RELEASE_VERSION" --draft=false

  publish-coverage:
    name: Publish measured coverage
    needs: [prepare, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: native-rust-coverage
          path: coverage-site/reports
      - run: uv run --no-project python scripts/coverage_site.py --python coverage-site/reports/python-coverage.json --rust coverage-site/reports/summary.json --output coverage-site --project rdflib-turbo --revision "${{ needs.prepare.outputs.revision }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: coverage-site
      - uses: actions/deploy-pages@v5
        id: deployment

  inference-comparison:
    if: github.event_name == 'workflow_dispatch' && inputs['inference-comparison']
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
      - name: Compare original public source archives on one runner
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE_BASE: ${{ inputs['comparison-base'] }}
          COMPARE_HEAD: ${{ inputs['comparison-head'] }}
        run: uv run --no-project --python 3.13.16 python scripts/inference_comparison.py --base "$COMPARE_BASE" --head "$COMPARE_HEAD" --output "$RUNNER_TEMP/performance-comparison"
      - name: Retain original public inputs and comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-comparison-inputs
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/performance-comparison/base/sdist/*.tar.gz
            ${{ runner.temp }}/performance-comparison/head/sdist/*.tar.gz
            ${{ runner.temp }}/performance-comparison/base/wheels/*.whl
            ${{ runner.temp }}/performance-comparison/head/wheels/*.whl
            ${{ runner.temp }}/performance-comparison/*.whl
            ${{ runner.temp }}/performance-comparison/*.json
            ${{ runner.temp }}/performance-comparison/base/*.json
            ${{ runner.temp }}/performance-comparison/head/*.json
            ${{ runner.temp }}/performance-comparison/*.log
            ${{ runner.temp }}/performance-comparison/base/*.log
            ${{ runner.temp }}/performance-comparison/head/*.log
            ${{ runner.temp }}/performance-comparison/*-runtime/pyproject.toml
            ${{ runner.temp }}/performance-comparison/*-runtime/uv.lock
            ${{ runner.temp }}/performance-comparison/oracles/fixtures.json
            ${{ runner.temp }}/performance-comparison/oracles/*.nt
