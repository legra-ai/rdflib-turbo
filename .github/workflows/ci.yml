name: Tests and wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested alpha to PyPI
        type: boolean
        default: false
  schedule:
    - cron: '23 4 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash {0}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - id: release
        run: python scripts/prepare_release.py

  sdist:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
      - run: uv build --sdist --out-dir dist -C 'maturin.build-args=--locked'
      - run: uvx --from twine==6.2.0 twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: [prepare, sdist]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64:latest
          - os: macos-15-intel
            target: x86_64-apple-darwin
            deployment_target: '10.12'
          - os: macos-15
            target: aarch64-apple-darwin
            deployment_target: '11.0'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
          target: ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: release-sdist
          path: source-dist
      - name: Unpack tested source distribution for manylinux
        if: runner.os == 'Linux'
        run: |
          mkdir source-build || exit 1
          tar -xzf source-dist/*.tar.gz --strip-components=1 -C source-build || exit 1
      - name: Build native manylinux wheel from source archive
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          target: ${{ matrix.target }}
          manylinux: '2_28'
          container: ${{ matrix.container }}
          working-directory: source-build
          args: --release --locked --out ../dist --interpreter python3.11
      - name: Build native wheel from source archive
        if: runner.os != 'Linux'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: uv build --wheel --out-dir dist -C 'maturin.build-args=--locked --target ${{ matrix.target }} --compatibility pypi' source-dist/*.tar.gz
      - run: uvx --from twine==6.2.0 twine check --strict dist/*
      - name: Test the installed wheel without source-tree imports
        run: python scripts/test_wheel.py
      - uses: actions/upload-artifact@v7
        with:
          name: release-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@nightly-2026-10-16
        with:
          components: rustfmt
      - run: cargo +nightly-2026-10-16 fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: uvx ruff check python tests scripts
      - run: uvx ruff format --check python tests scripts

  test:
    name: test
    needs: [prepare, verify, sdist, wheels]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all release checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json, os
          failures = [name for name, job in json.loads(os.environ['RESULTS']).items() if job['result'] != 'success']
          if failures:
              raise SystemExit(f'Required release checks failed: {failures}')
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: python scripts/release_packages.py check-build

  publish:
    needs: [prepare, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rdflib-turbo/
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/tag_release.py
      - name: Create draft prerelease if absent
        run: |
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            printf 'Restoring existing release artifacts\n'
          else
            gh release create "v$RELEASE_VERSION" --verify-tag --title "v$RELEASE_VERSION" --notes-file docs/release-notes.md --draft --prerelease || exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: python scripts/release_packages.py stage
      - id: pending
        run: python scripts/release_packages.py filter
      - if: steps.pending.outputs.missing == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pending-packages/
      - run: python scripts/release_packages.py verify
      - run: gh release edit "v$RELEASE_VERSION" --draft=false
