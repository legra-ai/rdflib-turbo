name: Tests and wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested alpha to PyPI
        type: boolean
        default: false
  schedule:
    - cron: '23 4 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash {0}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - id: release
        run: uv run --no-project python scripts/prepare_release.py

  sdist:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
          # Archives normalize mtimes; path-dependency artifacts require content identity.
          cache-key: vendor-${{ hashFiles('vendor/**') }}
      - run: uv build --sdist --out-dir dist -C 'maturin.build-args=--locked'
      - run: uv tool run --from twine==6.2.0 twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: [prepare, sdist]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64:latest
          - os: macos-15-intel
            target: x86_64-apple-darwin
            deployment_target: '11.0'
          - os: macos-15
            target: aarch64-apple-darwin
            deployment_target: '11.0'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
          target: ${{ matrix.target }}
          cache-key: vendor-${{ hashFiles('vendor/**') }}
      - uses: actions/download-artifact@v8
        with:
          name: release-sdist
          path: source-dist
      - name: Unpack tested source distribution for manylinux
        if: runner.os == 'Linux'
        run: |
          mkdir source-build || exit 1
          tar -xzf source-dist/*.tar.gz --strip-components=1 -C source-build || exit 1
      - name: Build native manylinux wheel from source archive
        if: runner.os == 'Linux'
        run: sh scripts/build_manylinux.sh '${{ matrix.container }}' '${{ matrix.target }}' cp311-cp311
      - name: Build native wheel from source archive
        if: runner.os != 'Linux'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
          # Keep native builds outside uv's temporary source-archive extraction.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: uv build --wheel --out-dir dist -C 'maturin.build-args=--locked --target ${{ matrix.target }} --compatibility pypi' source-dist/*.tar.gz
      - run: uv tool run --from twine==6.2.0 twine check --strict dist/*
      - name: Test the installed wheel without source-tree imports
        run: uv run --no-project python scripts/test_wheel.py
      - uses: actions/upload-artifact@v7
        with:
          name: release-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  native-coverage:
    needs: prepare
    uses: ./.github/workflows/native-coverage.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          cache-key: vendor-${{ hashFiles('vendor/**') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt
      - run: cargo +nightly-2026-10-16 fmt --check
      - run: cargo clippy --locked -- -D warnings
      - name: Patched datatype parser regressions
        run: cargo test --locked -p oxsdatatypes --lib
      - name: Additive dataset transaction regressions
        run: cargo test --locked --manifest-path vendor/oxrdf-0.3.4/Cargo.toml --all-features --lib
      - name: Exact-term transactional storage contracts
        run: make test-store-contract
      - name: Native inference allocation budget
        shell: uv run --no-project --python 3.13 python {0}
        run: |
          import os
          import sys
          sys.path.insert(0, os.getcwd())
          from scripts.native_coverage import embedded_python_environment, run
          environment = embedded_python_environment(sys.executable, dict(os.environ))
          environment['PYO3_PYTHON'] = sys.executable
          run(['cargo', 'test', '--locked', '--release', '--features', 'allocation-profiling',
               'allocation_tests::inference_heap_budget', '--', '--ignored', '--exact',
               '--nocapture', '--test-threads=1'], environment)
      - run: uv run --locked --extra test ruff check python tests scripts
      - run: uv run --locked --extra test ruff format --check python tests scripts

  test:
    name: test
    needs: [prepare, verify, sdist, wheels, native-coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Require all release checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: uv run --no-project python {0}
        run: |
          import json, os
          failures = [name for name, job in json.loads(os.environ['RESULTS']).items() if job['result'] != 'success']
          if failures:
              raise SystemExit(f'Required release checks failed: {failures}')
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: uv run --no-project python scripts/release_packages.py check-build

  publish:
    needs: [prepare, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rdflib-turbo/
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: uv run --no-project python scripts/tag_release.py
      - name: Create draft prerelease if absent
        run: |
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            printf 'Restoring existing release artifacts\n'
          else
            gh release create "v$RELEASE_VERSION" --verify-tag --title "v$RELEASE_VERSION" --notes-file docs/release-notes.md --draft --prerelease || exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: uv run --no-project python scripts/release_packages.py stage
      - id: pending
        run: uv run --no-project python scripts/release_packages.py filter
      - name: Attest the original tested archives
        if: steps.pending.outputs.missing == 'true'
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027
        with:
          paths: pending-packages/*
      - if: steps.pending.outputs.missing == 'true'
        run: uv publish --trusted-publishing always pending-packages/*
      - run: uv run --no-project python scripts/release_packages.py verify
      - run: gh release edit "v$RELEASE_VERSION" --draft=false

  publish-coverage:
    name: Publish measured coverage
    needs: [prepare, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: native-rust-coverage
          path: coverage-site/reports
      - run: uv run --no-project python scripts/coverage_site.py --python coverage-site/reports/python-coverage.json --rust coverage-site/reports/summary.json --output coverage-site --project rdflib-turbo --revision "${{ needs.prepare.outputs.revision }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: coverage-site
      - uses: actions/deploy-pages@v5
        id: deployment
