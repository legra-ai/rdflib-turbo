name: Native Rust coverage
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      facade-artifact:
        required: false
        type: string
        default: ''
  schedule:
    - cron: '11 6 * * 1'
permissions:
  contents: read
defaults:
  run:
    shell: bash {0}
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
          cache-key: vendor-${{ hashFiles('vendor/**') }}
      - name: Prepare one facade cohort for this standalone coverage run
        if: inputs['facade-artifact'] == ''
        run: uv run --no-project --python 3.13 python -B scripts/ci_facade.py prepare --output "$RUNNER_TEMP/candidate-facade-evidence"
      - uses: actions/download-artifact@v8
        if: inputs['facade-artifact'] != ''
        with:
          name: ${{ inputs['facade-artifact'] }}
          path: ${{ runner.temp }}/candidate-facade-evidence
      - name: Verify the facade cohort and arrange exact source peers
        run: uv run --no-project --python 3.13 python -B scripts/ci_facade.py consume --input "$RUNNER_TEMP/candidate-facade-evidence" --environment-file "$GITHUB_ENV"
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: uv run --no-project python scripts/native_coverage.py --shacl-source "$SHACL_SOURCE" --shacl-wheel "$SHACL_WHEEL" --shacl-candidate-receipt "$SHACL_CANDIDATE_RECEIPT" --shacl-base-revision "$SHACL_BASE_REVISION" --owlrl-source "$OWLRL_SOURCE" --owlrl-wheel "$OWLRL_WHEEL" --yaml-authority "$YAML_AUTHORITY" --owlrl-archive "$OWLRL_ARCHIVE" --owlrl-sha256 "$OWLRL_SHA256"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-rust-coverage
          path: native-coverage/
          if-no-files-found: error
